name: Copilot setup steps

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - scripts/wait-for-dev.sh
      - scripts/wait-for-dev.test.mjs

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test the readiness check
        run: node --test scripts/wait-for-dev.test.mjs
      - name: Start Shipboard and wait for the homepage
        run: |
          # Next.js appends generated instructions to AGENTS.md on startup.
          trap 'git restore -- AGENTS.md' EXIT
          dev_log="$RUNNER_TEMP/shipboard-dev.log"
          nohup bash -c '
            "$@" || {
              echo "Dev server exited with an error. Retrying once."
              exec "$@"
            }
          ' bash npm run dev -- --hostname 127.0.0.1 --port 3000 > "$dev_log" 2>&1 < /dev/null &
          if ! bash scripts/wait-for-dev.sh; then
            cat "$dev_log"
            exit 1
          fi
